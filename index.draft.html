                    <span class="confidence-tag" style="border-color:${hexToRgba(CONFIDENCE_COLORS[edge.confidence] || CONFIDENCE_COLORS.low, 0.3)}; color:${CONFIDENCE_COLORS[edge.confidence] || CONFIDENCE_COLORS.low};">
                      ${escapeHtml(edge.confidence || "low")}
                    </span>
                    <span class="site-tag" style="border-color:${hexToRgba(SE_SITE_COLORS[neighbor.se_site] || "#777", 0.22)}; color:${SE_SITE_COLORS[neighbor.se_site] || "var(--fg-muted)"};">
                      ${escapeHtml(neighbor.se_site || "unknown")}
                    </span>
                  </div>
                  <div class="reasoning js-reasoning" data-edge-id="${escapeAttribute(String(edge.id))}">
                    ${escapeHtml(edge.reasoning || "No reasoning available.")}
                  </div>
                </article>
              `).join("")}
            </div>
          </div>
        `;
      }).filter(Boolean);

      if (!sections.length) {
        return `<p class="panel-subtitle">No connected frames are visible under the current filters.</p>`;
      }

      return sections.join("");
    }

    function bindConnectedReasoningEvents() {
      for (const button of els.content.querySelectorAll(".js-why-button")) {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          const edgeId = button.getAttribute("data-edge-id");
          if (!edgeId) return;
          const reasoning = els.content.querySelector(`.js-reasoning[data-edge-id="${CSS.escape(edgeId)}"]`);
          reasoning?.classList.toggle("visible");
        });
      }
    }

    function bindConnectedCardNavigation() {
      for (const card of els.content.querySelectorAll(".js-connected-card")) {
        const open = () => {
          const frameId = card.getAttribute("data-frame-id");
          if (frameId) openFrame(frameId);
        };
        card.addEventListener("click", open);
        card.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            open();
          }
        });
      }
    }

    function showTooltip(html, x, y) {
      els.tooltip.innerHTML = html;
      els.tooltip.classList.add("visible");
      els.tooltip.setAttribute("aria-hidden", "false");
      positionTooltip(x, y);
    }

    function positionTooltip(x, y) {
      const pad = 12;
      const rect = els.tooltip.getBoundingClientRect();
      let left = x + 14;
      let top = y + 14;

      if (left + rect.width > window.innerWidth - pad) {
        left = x - rect.width - 14;
      }
      if (top + rect.height > window.innerHeight - pad) {
        top = y - rect.height - 14;
      }

      els.tooltip.style.left = `${Math.max(pad, left)}px`;
      els.tooltip.style.top = `${Math.max(pad, top)}px`;
    }

    function hideTooltip() {
      els.tooltip.classList.remove("visible");
      els.tooltip.setAttribute("aria-hidden", "true");
    }

    function renderEmptyGraph(container, title, copy) {
      const wrapper = document.createElement("div");
      wrapper.className = "empty-state";
      wrapper.innerHTML = `
        <div class="empty-state-inner">
          <div class="empty-title">${escapeHtml(title)}</div>
          <p class="empty-copy">${escapeHtml(copy)}</p>
        </div>
      `;
      container.appendChild(wrapper);
    }

    function showLoadError(message) {
      els.errorMessage.innerHTML = escapeHtml(message).replaceAll("\n", "<br>");
      els.errorState.classList.add("visible");
      els.content.innerHTML = `
        <div class="error-card">
          <div class="error-card-inner">
            <h2 class="error-title">Could not load graph data</h2>
            <p class="error-copy">${escapeHtml(message).replaceAll("\n", "<br>")}</p>
            ${window.location.protocol === "file:" ? `<div class="error-command">python -m http.server 8000</div>` : ""}
          </div>
        </div>
      `;
    }

    function debounce(fn, wait = 120) {
      let timer = null;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), wait);
      };
    }

    function drawForceGraph({
      container,
      nodes,
      links,
      ariaLabel,
      keyPrefix,
      selectedId = null,
      chargeStrength = -180,
      linkDistance = () => 40,
      collidePadding = 4,
      linkWidth = () => 1,
      linkColor = () => "rgba(255,255,255,0.12)",
      nodeStroke = () => "rgba(255,255,255,0.14)",
      defaultAnchor = null,
      onNodeClick = null,
      onNodeHover = null,
      labelAccessor = null,
      labelFilter = null
    }) {
      container.innerHTML = "";

      const bounds = container.getBoundingClientRect();
      const width = Math.max(320, Math.floor(bounds.width || container.clientWidth || 640));
      const height = Math.max(320, Math.floor(bounds.height || container.clientHeight || 520));

      const svg = d3.select(container)
        .append("svg")
        .attr("class", "graph-svg")
        .attr("role", "img")
        .attr("aria-label", ariaLabel);

      const g = svg.append("g").attr("class", "viewport");
      const linkLayer = g.append("g").attr("class", "links");
      const nodeLayer = g.append("g").attr("class", "nodes");
      const labelLayer = labelAccessor ? g.append("g").attr("class", "labels") : null;

      svg.call(
        d3.zoom()
          .scaleExtent([0.2, 8])
          .on("zoom", (event) => {
            g.attr("transform", event.transform);
          })
      );

      const localNodes = nodes.map(node => {
        const key = `${keyPrefix}:${node.id}`;
        const previous = state.nodePositions.get(key);
        const x = previous?.x ?? defaultAnchor?.x ?? width / 2 + (Math.random() - 0.5) * 40;
        const y = previous?.y ?? defaultAnchor?.y ?? height / 2 + (Math.random() - 0.5) * 40;
        return { ...node, x, y };
      });

      const localLinks = links.map(link => ({ ...link }));

      const link = linkLayer.selectAll("line")
        .data(localLinks, d => d.id ?? `${d.source}-${d.target}`)
        .join("line")
        .attr("class", "graph-link")
        .attr("stroke", d => linkColor(d))
        .attr("stroke-width", d => linkWidth(d))
        .attr("opacity", 1);

      const node = nodeLayer.selectAll("g")
        .data(localNodes, d => d.id)
        .join(enter => {
          const group = enter.append("g")
            .attr("class", d => `graph-node${d.id === selectedId ? " is-selected" : ""}${d.muted ? " is-muted" : ""}`)
            .attr("tabindex", 0)
            .attr("role", "button")
            .attr("aria-label", d => d.label || String(d.id));

          group.append("circle")
            .attr("class", "selection-ring")
            .attr("r", d => d.id === selectedId ? d.r + 5 : 0);

          group.append("circle")
            .attr("class", "core")
            .attr("r", d => d.r)
            .attr("fill", d => {
              const frameType = d.frame?.frame_type || d.dominantType || "other";
              return FRAME_TYPE_COLORS[frameType] || FRAME_TYPE_COLORS.other;
            })
            .attr("stroke", d => nodeStroke(d))
            .attr("stroke-width", d => d.id === selectedId ? 2 : 1);

          group.append("title").text(d => d.label || String(d.id));
          return group;
        });

      node
        .on("mouseenter", function(event, d) {
          if (!onNodeHover) return;
          const html = onNodeHover(d);
          if (html) showTooltip(html, event.clientX, event.clientY);
        })
        .on("mousemove", function(event) {
          if (!onNodeHover) return;
          positionTooltip(event.clientX, event.clientY);
        })
        .on("mouseleave", function() {
          hideTooltip();
        })
        .on("focus", function(event, d) {
          if (!onNodeHover) return;
          const html = onNodeHover(d);
          const rect = event.currentTarget.getBoundingClientRect();
          if (html) showTooltip(html, rect.right + 10, rect.top + 10);
        })
        .on("blur", function() {
          hideTooltip();
        })
        .on("click", function(event, d) {
          event.stopPropagation();
          onNodeClick?.(d);
        })
        .on("keydown", function(event, d) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            onNodeClick?.(d);
          }
        });

      const drag = d3.drag()
        .on("start", (event, d) => {
          if (!event.active) simulation.alphaTarget(0.2).restart();
          d.fx = d.x;
          d.fy = d.y;
        })
        .on("drag", (event, d) => {
          d.fx = event.x;
          d.fy = event.y;
        })
        .on("end", (event, d) => {
          if (!event.active) simulation.alphaTarget(0);
          d.fx = null;
          d.fy = null;
        });

      node.call(drag);

      let labels = null;
      if (labelAccessor && labelLayer) {
        labels = labelLayer.selectAll("text")
          .data(localNodes.filter(d => labelFilter ? labelFilter(d) : true), d => d.id)
          .join("text")
          .attr("class", "graph-label")
          .text(d => labelAccessor(d));
      }

      const simulation = d3.forceSimulation(localNodes)
        .force("link", d3.forceLink(localLinks).id(d => d.id).distance(linkDistance).strength(0.18))
        .force("charge", d3.forceManyBody().strength(chargeStrength))
        .force("center", d3.forceCenter(width / 2, height / 2))
        .force("collide", d3.forceCollide().radius(d => d.r + collidePadding))
        .velocityDecay(0.28);

      state.simulation = simulation;

      function ticked() {
        for (const nodeDatum of localNodes) {
          nodeDatum.x = clamp(nodeDatum.x, nodeDatum.r + 24, width - nodeDatum.r - 24);
          nodeDatum.y = clamp(nodeDatum.y, nodeDatum.r + 24, height - nodeDatum.r - 24);
          state.nodePositions.set(`${keyPrefix}:${nodeDatum.id}`, { x: nodeDatum.x, y: nodeDatum.y });
        }

        link
          .attr("x1", d => d.source.x)
          .attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x)
          .attr("y2", d => d.target.y);

        node
          .attr("transform", d => `translate(${d.x},${d.y})`);

        if (labels) {
          labels
            .attr("x", d => d.x)
            .attr("y", d => d.y + d.r + 13);
        }
      }

      if (REDUCED_MOTION) {
        simulation.stop();
        for (let i = 0; i < 180; i += 1) simulation.tick();
        ticked();
      } else {
        simulation.on("tick", ticked);
        setTimeout(() => simulation.alphaTarget(0), 900);
      }
    }
  </script>
</body>
</html>
